.side{width:200px;flex:none;background:var(--side);backdrop-filter:blur(10px);padding:22px 12px;display:flex;flex-direction:column;gap:6px;color:#f2f5f7}
.logo{display:flex;gap:10px;align-items:center;font-size:24px;font-weight:700;padding:0 8px 22px;opacity:.85}
.nav{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;font-size:14px;font-weight:600;line-height:1.2}
.nav small{display:block;font-weight:400;font-size:11.5px;opacity:.7}
.nav:hover{background:rgba(255,255,255,.1)}.nav[aria-current=page]{background:rgba(255,255,255,.2)}
.nav:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid #fff;outline-offset:2px}
.nav svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;padding:22px 24px;min-width:0}
header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}
h1{font-size:22px;font-weight:700}h1+p{font-size:21px;margin-top:2px;line-height:1.3}
.amb{display:flex;gap:10px;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px;font-weight:600;white-space:nowrap;backdrop-filter:blur(7px)}
.sw{all:unset;cursor:pointer;width:38px;height:22px;border-radius:12px;background:#8a97a1;position:relative;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw[aria-checked=true]{background:#5f7f98}.sw[aria-checked=true]::after{left:19px}
.grid{display:grid;grid-template-columns:1.1fr 1.4fr 1fr;gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:16px;backdrop-filter:blur(7px);box-shadow:0 8px 30px rgba(40,60,80,.12)}
.card h2{font-size:16px;font-weight:600;margin-bottom:6px}.card h2 small{display:block;font-size:12px;font-weight:400;color:var(--mute)}
.quote{font-family:'Caveat',cursive;font-size:23px;text-align:center;padding:10px 6px 4px;line-height:1.3}
.tabs{display:flex;gap:14px;font-size:13px;margin-bottom:12px}
.tabs button{all:unset;cursor:pointer;color:var(--mute);padding-bottom:3px;border-bottom:2px solid transparent}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--ink)}
.note{position:relative;background:var(--paper);border-radius:6px 6px 26px 6px;padding:22px 20px;min-height:210px;font-family:'Caveat',cursive;font-size:23px;line-height:1.5;color:#3b3226;box-shadow:0 10px 18px rgba(60,40,10,.25);transform:rotate(-1deg)}
.note::before{content:"";position:absolute;top:-16px;right:26px;width:18px;height:46px;border:2px solid #9a9a9a;border-radius:10px}
.photo{height:290px;border-radius:22px;border:1px solid var(--line);position:relative;overflow:hidden;background:linear-gradient(120deg,#e9e1d3,#c9d6df 60%,#b7c9d6)}
.photo svg{position:absolute;inset:0;width:100%;height:100%}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.j{all:unset;box-sizing:border-box;cursor:pointer;min-height:200px;border-radius:16px;padding:14px;font-size:15px;font-weight:600;display:block}
.j small{display:block;font-weight:400;font-size:12px;opacity:.75;margin-top:2px}
.j.d{background:#2c2c2e;color:#fff}.j.s{background:linear-gradient(160deg,#d9e2ef,#e9cfe0 60%,#c9d4f0);color:#26323d;text-align:left;position:relative}
.j.s svg{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);width:34px;stroke:#5c6a85;fill:none;stroke-width:1.8}
.journal textarea{all:unset;box-sizing:border-box;width:100%;height:130px;margin-top:10px;font-size:14px;line-height:1.4;white-space:pre-wrap;color:#fff;cursor:text}
.plan{list-style:none;padding:0;display:grid;gap:9px;font-size:13.5px}
.plan li{display:flex;gap:9px;align-items:center;cursor:pointer}
.plan .c{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--mute);display:grid;place-items:center;font-size:10px;color:transparent;flex:none}
.plan .on .c{background:#6d8aa3;border-color:#6d8aa3;color:#fff;color:#fff}.plan .on span{opacity:.6}
.bar{height:8px;border-radius:6px;background:rgba(255,255,255,.55);margin:12px 0 8px;overflow:hidden}.bar i{display:block;height:100%;background:#5d6d79;border-radius:6px;transition:width .3s}
.pill{display:flex;gap:6px;font-size:12px;margin:8px 0 10px}.pill span{padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.35)}.pill span:first-child{background:rgba(255,255,255,.7);font-weight:700}
.ctr{display:flex;justify-content:center;align-items:center;gap:26px;margin-top:12px}
.ctr button{all:unset;cursor:pointer;display:grid;place-items:center;width:30px;height:30px}.ctr svg{width:22px;height:22px;fill:var(--ink)}
.pb{height:4px;border-radius:2px;background:rgba(255,255,255,.55);margin-top:8px}.pb i{display:block;width:22%;height:100%;background:var(--ink);border-radius:2px}
@media(max-width:1100px){.grid{grid-template-columns:1fr 1fr}.col:nth-child(3){grid-column:1/-1}}
@media(max-width:760px){body{flex-direction:column}.side{width:100%;flex-direction:row;overflow-x:auto;padding:10px}.logo{display:none}.nav small{display:none}.nav{white-space:nowrap}header{flex-direction:column}.grid{grid-template-columns:1fr}h1+p{font-size:18px}}
.pt{display:grid;grid-template-columns:1fr 1fr;gap:18px;height:calc(100vh - 130px);min-height:520px}
.stage{position:relative;overflow:hidden;border-radius:22px;border:1px solid var(--line);background:linear-gradient(160deg,#cfe0ee,#e6d9ee 60%,#d3e3f1);box-shadow:0 8px 30px rgba(40,60,80,.12);isolation:isolate}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 28%;transform-origin:50% 88%;display:none;will-change:transform}
.stage.hasimg canvas{display:block}
.stage.hasimg .ph{display:none}
.stage.hasimg{background:#cfd9de}
.ph{position:absolute;inset:0;display:grid;place-items:end center}
.ph svg{height:88%;width:auto;max-width:100%;transform-origin:50% 100%}
.ring{position:absolute;inset:0;border-radius:22px;pointer-events:none;transition:box-shadow .4s}
.stage.speaking .ring{box-shadow:inset 0 0 0 3px rgba(143,191,230,.95),inset 0 0 70px rgba(143,191,230,.5);animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{opacity:.5}}
.tag{position:absolute;left:14px;top:14px;display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:14px;background:var(--glass2);backdrop-filter:blur(7px);border:1px solid var(--line)}
.tag b{display:block;font-size:14px}.tag small{display:block;font-size:12px;color:var(--mute)}
.dot{width:9px;height:9px;border-radius:50%;background:#7fcf9a;flex:none}
.stage.speaking .dot{background:#6aa7da;animation:pls 1s ease-in-out infinite}
.stage.listening .dot{background:#e58a8a;animation:pls 1s ease-in-out infinite}
@keyframes pls{50%{transform:scale(1.5);opacity:.6}}
.eq{display:flex;gap:3px;align-items:flex-end;height:20px;margin-left:4px}
.eq i{width:4px;height:4px;border-radius:2px;background:#5d6d79}
.stage.speaking .eq i{animation:eq .8s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.12s}.eq i:nth-child(3){animation-delay:.28s}.eq i:nth-child(4){animation-delay:.05s}.eq i:nth-child(5){animation-delay:.2s}
@keyframes eq{0%,100%{height:4px}50%{height:19px}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
#mouth{transform-box:fill-box;transform-origin:center}
.stage.speaking #mouth{animation:talk .3s steps(2,end) infinite alternate}
@keyframes talk{from{transform:scaleY(1)}to{transform:scaleY(3.4)}}
.stage.speaking .ph svg{animation:bob 1.3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) scale(1.012)}}
.chat{display:flex;flex-direction:column;min-height:0;height:100%}
.ch-hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px}
.ch-hd h2{margin:0}
.opts{display:flex;gap:10px;align-items:center;font-size:12.5px;font-weight:600}
.op{display:flex;gap:7px;align-items:center}
.opts select{border:1px solid var(--line);background:rgba(255,255,255,.55);border-radius:10px;padding:5px 8px;font:inherit;color:var(--ink)}
.log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 8px}
.day{display:flex;flex-direction:column;gap:10px}
.dv{position:sticky;top:0;z-index:2;align-self:center;margin:2px 0}
.dv span{display:block;padding:3px 12px;border-radius:12px;background:var(--glass2);backdrop-filter:blur(7px);border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--mute)}
.b{max-width:84%;padding:10px 14px;border-radius:18px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.b.me{align-self:flex-end;background:#5f7f98;color:#fff;border-bottom-right-radius:6px}
.b.bot{align-self:flex-start;background:var(--glass2);border:1px solid var(--line);border-bottom-left-radius:6px}
.b.typ{display:flex;gap:4px;padding:13px 16px}
.b.typ i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:ty 1s ease-in-out infinite}
.b.typ i:nth-child(2){animation-delay:.15s}.b.typ i:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.qs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 8px}
.qs button{all:unset;cursor:pointer;font-size:12.5px;padding:5px 11px;border-radius:12px;background:rgba(255,255,255,.45);border:1px solid var(--line)}
.qs button:hover{background:rgba(255,255,255,.7)}
.bar2{display:flex;gap:8px;align-items:center}
.bar2 input{all:unset;box-sizing:border-box;flex:1;min-width:0;padding:11px 14px;border-radius:14px;background:rgba(255,255,255,.6);border:1px solid var(--line);font-size:14.5px;cursor:text}
.bar2 input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mic{all:unset;cursor:pointer;flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.6);border:1px solid var(--line)}
.mic svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mic[aria-pressed=true]{background:#e58a8a;animation:mp 1.2s ease-in-out infinite}
.mic[aria-pressed=true] svg{stroke:#fff}
@keyframes mp{50%{box-shadow:0 0 0 8px rgba(229,138,138,.25)}}
.mic[disabled]{opacity:.45;cursor:not-allowed}
.snd{all:unset;cursor:pointer;flex:none;padding:11px 16px;border-radius:14px;background:#5f7f98;color:#fff;font-size:14px;font-weight:700}
.snd:hover{background:#557591}
.st2{min-height:18px;font-size:12.5px;color:var(--mute);margin-top:6px}
.mic:focus-visible,.snd:focus-visible,.qs button:focus-visible,select:focus-visible{outline:2px solid #fff;outline-offset:2px;box-shadow:0 0 0 4px var(--accent)}
@media(max-width:900px){.pt{grid-template-columns:1fr;height:auto}.stage{height:44vh;min-height:300px}.chat{height:70vh;min-height:420px}}
@media(prefers-reduced-motion:reduce){.eye,.stage.speaking #mouth,.stage.speaking .ph svg,.stage.speaking .ring,.mic[aria-pressed=true],.b.typ i,.stage.speaking .eq i,.dot{animation:none!important}}

}

.amb{padding:5px 10px;font-size:12px;gap:8px}

<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
$('#amb').onclick=e=>{const b=e.currentTarget,on=b.getAttribute('aria-checked')!=='true';b.setAttribute('aria-checked',on);$('#ambTxt').textContent=on?'ON':'OFF'};
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- Settings: yahin se badlo ---------- */
const CFG={
  name:'My Partner',
  ttsLang:'hi-IN', // female Hindi voice; Gemini detects Hindi/Hinglish content
  maxSaved:5000 // itne messages tak history save rehti hai
};

/* ---------- State ---------- */
let S={msgs:[],voice:true,lang:'hi-IN'};
try{const s=JSON.parse(LS.get('sk_partner')||'null');if(s&&Array.isArray(s.msgs))S=Object.assign(S,s)}catch(e){}
const save=()=>{S.msgs=S.msgs.slice(-CFG.maxSaved);LS.set('sk_partner',JSON.stringify(S))};
const stage=$('#stage'),log=$('#log'),inp=$('#in');
let speaking=false,listening=false,busy=false;
$('#nm').textContent=CFG.name;

/* ---------- Status + character ---------- */
function status(){$('#stt').textContent=speaking?'Speaking…':listening?'Listening…':'Online';stage.classList.toggle('speaking',speaking);stage.classList.toggle('listening',listening)}
function setSpeaking(on){speaking=on;status()}
function hint(t){$('#ht').textContent=t}


/* ---------- Avatar: photo + live animation (blink, breathing, lip sync) ---------- */
// Coordinates neeche 600x600 photo ke hisaab se hain. Photo badlo to ye numbers bhi badalne padenge.
const A={img:null,ready:false,raf:0,last:0,text:'',pos:0,CPS:13.5,sp:0,o:0,r:0,to:0,tr:0,blink:0,blinkAt:2200,blinkT:-1,dbl:false,
  mouth:{x:299,y:331},
  eyes:[{x:199,y:205,rx:50,ry:40,rot:0},{x:387,y:192,rx:52,ry:42,rot:-5}],
  // Iris: photo mein iris ka center/radius, aur uske aas-paas aankh ke safed hisse ki ellipse (clip)
  irises:[{x:205.5,y:204,r:25,c:{x:201,y:203,rx:35,ry:29.5}},{x:375.5,y:187.5,r:25,c:{x:376.5,y:188,rx:34,ry:30}}],
  onChat:false,rangeX:6.5,rangeY:4.5,gx:0,gy:0,mx:null,my:null,moved:-1e9,dx:0,dy:0,driftAt:0,
  skin:'rgb(255,234,211)',lid:'rgb(238,201,170)',ink:'#2a1410'};
const cv=$('#cv'),g=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function feather(c,inner){const k=c.getContext('2d'),rx=c.width/2,ry=c.height/2;k.save();k.globalCompositeOperation='destination-in';k.translate(rx,ry);k.scale(1,ry/rx);const gr=k.createRadialGradient(0,0,0,0,0,rx);gr.addColorStop(0,'#000');gr.addColorStop(inner,'#000');gr.addColorStop(1,'rgba(0,0,0,0)');k.fillStyle=gr;k.fillRect(-rx*2,-rx*2,rx*4,rx*4);k.restore()}
let patch=null;const lids=[];
function prep(){
  patch=mk(130,76);const k=patch.getContext('2d');k.fillStyle=A.skin;k.fillRect(0,0,130,76);feather(patch,.7);
  A.eyes.forEach(e=>lids.push(mk(e.rx*2+26,e.ry*2+26)));
  A.irises.forEach(e=>{const d=Math.ceil(e.r*2+6),c=mk(d,d),k=c.getContext('2d');k.beginPath();k.arc(d/2,d/2,e.r+1,0,7);k.clip();k.drawImage(A.img,e.x-d/2,e.y-d/2,d,d,0,0,d,d);irisBuf.push(c)});
}
const irisBuf=[];
function drawIris(e,i){
  const c=irisBuf[i],d=c.width;
  g.save();g.beginPath();g.ellipse(e.c.x,e.c.y,e.c.rx,e.c.ry,0,0,7);g.clip();
  const gr=g.createLinearGradient(0,e.y-e.r-1,0,e.y+e.r+1);gr.addColorStop(0,'#e3e4e4');gr.addColorStop(.22,'#f3f1f0');gr.addColorStop(1,'#f3f1f0');
  g.fillStyle=gr;g.beginPath();g.arc(e.x,e.y,e.r+1.2,0,7);g.fill();
  g.drawImage(c,e.x-d/2+A.gx*A.rangeX,e.y-d/2+A.gy*A.rangeY);
  g.restore();
}
// cursor ki taraf dekhna
function eyeScreen(px,py){const r=cv.getBoundingClientRect(),sc=Math.max(r.width/600,r.height/600);return[r.left+(r.width-600*sc)/2+px*sc,r.top+(r.height-600*sc)*.28+py*sc]}
addEventListener('pointermove',e=>{A.mx=e.clientX;A.my=e.clientY;A.moved=performance.now();A.onChat=!!(e.target.closest&&e.target.closest('.chat'))},{passive:true});
document.addEventListener('pointerleave',()=>{A.moved=-1e9;A.onChat=false});
addEventListener('blur',()=>{A.moved=-1e9});
function viseme(c,t){
  c=(c||' ').toLowerCase();let o=.3,r=.15;
  if('a'.includes(c)){o=.95;r=0}else if(c==='e'){o=.55;r=0}else if(c==='i'){o=.4;r=0}else if(c==='o'){o=.75;r=.9}else if(c==='u'){o=.5;r=1}
  else if('mbp'.includes(c)){o=0;r=.3}else if('fv'.includes(c)){o=.12;r=0}
  else if(' '.includes(c)){o=.12;r=0}else if(',.?!;:-'.includes(c)){o=0;r=0}
  else if(!/[a-z\u0900-\u097f]/.test(c)){o=.1;r=0}
  A.to=o*(.86+.14*Math.sin(t/55));A.tr=r;
}
function drawLid(e,i,b){
  const c=lids[i],k=c.getContext('2d'),w=c.width,h=c.height;
  k.clearRect(0,0,w,h);
  const top=h/2-e.ry,edge=b>=.98?h:top+b*e.ry*2;
  const gr=k.createLinearGradient(0,top,0,h/2+e.ry);gr.addColorStop(0,A.lid);gr.addColorStop(1,A.skin);
  k.fillStyle=gr;k.fillRect(0,0,w,edge);feather(c,.74);
  g.save();g.translate(e.x,e.y);g.rotate(e.rot*Math.PI/180);g.drawImage(c,-w/2,-h/2);
  const y=Math.min(-e.ry+b*e.ry*2,e.ry*.42);
  g.strokeStyle=A.ink;g.lineWidth=5.5;g.lineCap='round';g.beginPath();g.moveTo(-e.rx*.8,y-5);g.quadraticCurveTo(0,y+9,e.rx*.8,y-5);g.stroke();
  g.restore();
}
function drawMouth(o,r){
  const m=A.mouth;g.drawImage(patch,m.x-65,m.y-38);
  g.save();g.translate(m.x,m.y);g.lineJoin='round';g.lineCap='round';
  if(o<.07){g.strokeStyle='#5a2a22';g.lineWidth=3.2;g.beginPath();g.moveTo(-26,-1);g.quadraticCurveTo(0,6,26,-1);g.stroke();g.restore();return}
  const hw=31-11*r,H=4+34*o,top=-H*.42;
  const path=()=>{g.beginPath();g.moveTo(-hw,0);g.bezierCurveTo(-hw*.6,top*1.35,hw*.6,top*1.35,hw,0);g.bezierCurveTo(hw*.75,H*.95,-hw*.75,H*.95,-hw,0);g.closePath()};
  path();g.fillStyle='#6a2230';g.fill();
  g.save();path();g.clip();
  if(o>.22){g.fillStyle='#fff';g.fillRect(-hw,top*1.1,hw*2,Math.min(8,H*.32)+Math.abs(top)*.25)}
  g.fillStyle='#ee8b92';g.beginPath();g.ellipse(0,H*.62,hw*.62,Math.max(2,H*.3),0,0,7);g.fill();
  g.restore();
  path();g.strokeStyle=A.ink;g.lineWidth=3.2;g.stroke();g.restore();
}
function frame(t){
  A.raf=requestAnimationFrame(frame);
  if(!A.ready||!stage.classList.contains('hasimg')||document.hidden){A.last=t;return}
  const dt=Math.min(.05,(t-A.last)/1000||.016);A.last=t;
  if(speaking&&A.text){A.pos=Math.min(A.text.length,A.pos+dt*A.CPS);viseme(A.text[Math.min(Math.floor(A.pos),A.text.length-1)],t)}else{A.to=0;A.tr=0}
  const k=1-Math.exp(-dt*24);A.o+=(A.to-A.o)*k;A.r+=(A.tr-A.r)*k;
  A.sp+=((speaking?1:0)-A.sp)*(1-Math.exp(-dt*4));
  // blink
  if(A.blinkT<0&&t>A.blinkAt){A.blinkT=0}
  if(A.blinkT>=0){A.blinkT+=dt;const d=.16,u=A.blinkT/d;A.blink=u<1?(u<.45?u/.45:1-(u-.45)/.55):0;if(u>=1){A.blinkT=-1;A.blink=0;A.blinkAt=A.dbl?t+120:t+2200+Math.random()*3800;A.dbl=!A.dbl&&Math.random()<.2}}
  let tx0=0,ty0=0;
  if(A.onChat||document.activeElement===inp){tx0=0;ty0=0}
  else if(t-A.moved<6000&&A.mx!==null){const[ex,ey]=eyeScreen(290,196);tx0=Math.tanh((A.mx-ex)/260);ty0=Math.tanh((A.my-ey)/220)}
  else{if(t>A.driftAt){A.dx=(Math.random()-.5)*.35;A.dy=(Math.random()-.5)*.25;A.driftAt=t+2200+Math.random()*3000}tx0=A.dx;ty0=A.dy}
  const gk=1-Math.exp(-dt*16);A.gx+=(tx0-A.gx)*gk;A.gy+=(ty0-A.gy)*gk;
  g.clearRect(0,0,600,600);g.drawImage(A.img,0,0);
  A.irises.forEach(drawIris);
  if(A.blink>.04)A.eyes.forEach((e,i)=>drawLid(e,i,A.blink));
  drawMouth(A.o,A.r);
  if(!reduce){
    const s=1.06+Math.sin(t/1800)*.006+A.o*.006*A.sp;
    const rot=Math.sin(t/2300)*.5+Math.sin(t/850)*.3*A.sp+A.gx*.9;
    const ty=Math.sin(t/1700)*3+A.o*3*A.sp+A.gy*3,tx=Math.sin(t/3100)*2.5+A.gx*5;
    cv.style.transform='translate('+tx.toFixed(2)+'px,'+ty.toFixed(2)+'px) rotate('+rot.toFixed(3)+'deg) scale('+s.toFixed(4)+')';
  }
}
function initAvatar(src){
  if(!src)return;const im=new Image();
  im.onload=()=>{A.img=im;prep();A.ready=true;stage.classList.add('hasimg');A.blinkAt=performance.now()+2000;if(!A.raf)A.raf=requestAnimationFrame(frame)};
  im.onerror=()=>{};im.src=src;
}

/* ---------- Chat UI ---------- */
const dkey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()};
function dlabel(ts){
  if(!ts)return 'Earlier conversations';
  const d=new Date(ts),n=new Date(),y=new Date(n);y.setDate(n.getDate()-1);
  if(dkey(ts)===dkey(n))return 'Today';
  if(dkey(ts)===dkey(y))return 'Tomorrow';
  return d.toLocaleDateString('en-IN',d.getFullYear()===n.getFullYear()?{weekday:'short',day:'numeric',month:'short'}:{weekday:'short',day:'numeric',month:'short',year:'numeric'});
}
let lastDay=null,grp=null;
function resetDays(){lastDay=null;grp=null}
function day(ts){const k=ts?dkey(ts):'old';if(k!==lastDay||!grp){lastDay=k;grp=document.createElement('div');grp.className='day';const d=document.createElement('div'),sp=document.createElement('span');d.className='dv';sp.textContent=dlabel(ts);d.append(sp);grp.append(d);log.append(grp)}return grp}
function bubble(role,text,ts){const d=document.createElement('div');d.className='b '+role;d.textContent=text;if(ts)d.title=new Date(ts).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});day(ts).append(d);log.scrollTop=log.scrollHeight;return d}
function typing(on){let t=$('#tp');if(on&&!t){t=document.createElement('div');t.id='tp';t.className='b bot typ';t.setAttribute('aria-label','Typing…');t.innerHTML='<i></i><i></i><i></i>';log.append(t);log.scrollTop=log.scrollHeight}else if(!on&&t)t.remove()}
function render(){log.innerHTML='';resetDays();if(!S.msgs.length){bubble('bot','Hey! I’m here. Type or tap the microphone—share whatever is on your mind.',Date.now())}S.msgs.forEach(m=>bubble(m.r,m.t,m.d));log.scrollTop=log.scrollHeight}

/* ---------- Bolna (voice + typewriter) ---------- */
let replyAudio=null,replyAudioUrl=null,replyAudioCancel=null,speechGeneration=0;
function stopTalk(){speechGeneration++;if(replyAudioCancel){const finish=replyAudioCancel;replyAudioCancel=null;finish()}if(replyAudio){replyAudio.onended=replyAudio.onerror=null;replyAudio.pause();replyAudio=null}if(replyAudioUrl){URL.revokeObjectURL(replyAudioUrl);replyAudioUrl=null}}
function speakBrowser(text,finish){if(!('speechSynthesis'in window)||!window.SpeechSynthesisUtterance){hint('Is browser mein voice playback supported nahi hai. Chrome ya Edge try karein.');finish();return}try{speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(text);utterance.lang=S.lang||CFG.ttsLang;const voices=speechSynthesis.getVoices();const voice=voices.find(v=>/^hi(-|_)/i.test(v.lang));if(voice)utterance.voice=voice;utterance.onend=finish;utterance.onerror=()=>{hint('Reply aa gaya, par browser voice play nahi kar saka. Device volume check karein.');finish()};speechSynthesis.speak(utterance)}catch(_){hint('Browser voice start nahi ho payi. Device volume check karein.');finish()}}
function playGeminiVoice(base64,finish,text){let completed=false;const complete=()=>{if(completed)return;completed=true;replyAudioCancel=null;finish()};const fail=()=>{if(replyAudioUrl){URL.revokeObjectURL(replyAudioUrl);replyAudioUrl=null}replyAudio=null;speakBrowser(text,complete)};replyAudioCancel=()=>{if(replyAudio){replyAudio.onended=replyAudio.onerror=null;replyAudio.pause();replyAudio=null}complete()};try{const raw=atob(base64),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);replyAudioUrl=URL.createObjectURL(new Blob([bytes],{type:'audio/wav'}));replyAudio=new Audio(replyAudioUrl);replyAudio.onended=()=>{if(replyAudioUrl)URL.revokeObjectURL(replyAudioUrl);replyAudioUrl=null;replyAudio=null;complete()};replyAudio.onerror=fail;const promise=replyAudio.play();if(promise)promise.catch(fail)}catch(_){fail()}}
function botSay(text,audioReady=null){return new Promise(res=>{
  typing(false);
  const now=Date.now();S.msgs.push({r:'bot',t:text,d:now});save();
  const el=bubble('bot','',now);
  const useVoice=S.voice;
  let typed=false,spoken=!useVoice,i=0,fin=false;
  const done=()=>{if(fin||!typed)return;fin=true;clearTimeout(wd);clearInterval(iv);if(!useVoice||spoken)setSpeaking(false);res()};
  const wd=setTimeout(()=>{speechGeneration++;el.textContent=text;typed=spoken=true;if(replyAudio){replyAudio.onended=replyAudio.onerror=null;replyAudio.pause();replyAudio=null}if(replyAudioUrl){URL.revokeObjectURL(replyAudioUrl);replyAudioUrl=null}done()},Math.max(30000,text.length*250));
  A.text=text;A.pos=0;
  setSpeaking(true);
  const iv=setInterval(()=>{i+=Math.max(2,Math.ceil(text.length/100));el.textContent=text.slice(0,i);log.scrollTop=log.scrollHeight;if(i>=text.length){typed=true;done()}},16);
  if(useVoice){try{stopTalk();const generation=speechGeneration;const finish=()=>{spoken=true;setSpeaking(false);done()};if(generation===speechGeneration){if(audioReady)playGeminiVoice(audioReady,finish,text);else speakBrowser(text,finish)}}catch(_){speakBrowser(text,()=>{spoken=true;setSpeaking(false);done()})}}
})}

/* ---------- Dimaag: abhi sirf canned replies (frontend demo) ---------- */
const pick=a=>a[Math.floor(Math.random()*a.length)];
const RULES=[
  [/\b(hi|hello|hey|namaste|hii+)\b/i,['Hey! How is your day going?','Hello! Tell me, what is going on today?']],
  [/(thak|thaka|tired|stress|tension|udaas|sad|low feel|ghabra|anxious|pareshan)/i,['It sounds like today was heavy. Pause and take a deep breath. If you want, tell me what happened. I’m here.','I understand. You do not have to handle everything at once. Tell me one small thing that is troubling you the most right now.']],
  [/(khush|happy|mast|badhiya|great|maza|good news)/i,['That is lovely to hear! What happened today? Tell me the whole story.','Wonderful! Take a moment to enjoy this happiness. What is it about?']],
  [/(motivat|himmat|haar|give up|nahi ho raha)/i,['Even if it is slow, keep moving. Take just one small step today.','What did not happen yesterday can begin with one small step today. What could that first step be?']],
  [/(joke|hasao|funny)/i,['A computer told the doctor, “I have a virus.” The doctor said, “Rest, and we will restart you.”','One bug told another, “Tomorrow you will become a feature.” The other said, “Just don’t write the documentation.”']],
  [/(code|coding|dsa|project|exam|padhai|study|portal)/i,['Let’s talk practicalities. What is the main thing holding you up right now? We can handle things one at a time.','Break studying or coding into small blocks: focus for 25 minutes, then take a 5-minute break. There is a timer on the Routine page!']],
  [/(thank|thanks|shukriya|dhanyavad)/i,['Hey, it is okay. I’m right here.','Anytime. Tell me if there is anything else you want to share.']],
  [/(bye|good night|gn|sone|so jao|alvida)/i,['All right, get some rest. See you tomorrow. Good night!','All right then, take care of yourself. We can talk tomorrow.']]
];
const FALL=['Hmm, tell me more. I’m here.','I see. How long has this been going on?','Interesting. Could you tell me a little more?','I understand. What happened next?'];
// Gemini replies are generated in the authenticated Supabase Edge Function.
function requestLimit(request,ms,message){return new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error(message)),ms);Promise.resolve(request).then(value=>{clearTimeout(timer);resolve(value)},error=>{clearTimeout(timer);reject(error)})})}
async function getReply(text){const history=S.msgs.slice(0,-1).slice(-12).map(m=>({role:m.r==='bot'?'model':'user',text:m.t}));const result=await requestLimit(window.SukunBackend.partnerReply(text,history),20000,'Partner reply is taking too long. Please try again.');if(!result?.reply)throw new Error('Gemini returned an empty reply. Please try again.');return{text:result.reply}}

/* ---------- Bhejna ---------- */
async function send(text){
  text=(text||'').trim();if(!text||busy)return;
  busy=true;stopTalk();setSpeaking(false);hint('');
  if(!S.msgs.length){log.innerHTML='';resetDays()}
  const now=Date.now();S.msgs.push({r:'me',t:text,d:now});save();bubble('me',text,now);inp.value='';
  typing(true);
  try{const reply=await getReply(text);let audio=null,voiceError='';if(S.voice&&window.SukunBackend.partnerSpeak){try{const result=await requestLimit(window.SukunBackend.partnerSpeak(reply.text),18000,'Voice generation timed out.');audio=result?.audio||null;if(!audio)voiceError=result?.error||'Gemini returned no voice audio.'}catch(e){voiceError=e.message||'Voice generation failed.'}}await botSay(reply.text,audio);if(voiceError&&(!('speechSynthesis'in window)))hint('Reply aa gaya, voice nahi bani: '+voiceError)}catch(e){typing(false);hint(e.message||'Partner API is unavailable. Check Supabase Edge Function setup.')}
  busy=false;
}
$('#sd').onclick=()=>send(inp.value);
inp.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)send(inp.value)};
['Hi!','I feel a little tired today','I need motivation','Ek joke sunao'].forEach(q=>{const b=document.createElement('button');b.textContent=q;b.onclick=()=>send(q);$('#qs').append(b)});

/* ---------- Mic (Speech-to-Text) ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
if(!SR){$('#mic').disabled=true;$('#mic').title='Use Chrome or Edge for voice input'}
$('#mic').onclick=()=>{
  if(!SR){hint('Voice input is not supported in this browser. Please use Chrome or Edge.');return}
  if(listening){rec&&rec.stop();return}
  stopTalk();setSpeaking(false);hint('');
  rec=new SR();rec.lang=S.lang;rec.interimResults=true;rec.continuous=false;let got=false;
  rec.onstart=()=>{listening=true;$('#mic').setAttribute('aria-pressed','true');status()};
  rec.onresult=e=>{let t='';for(const r of e.results)t+=r[0].transcript;inp.value=t;got=true};
  rec.onerror=e=>hint(e.error==='not-allowed'||e.error==='service-not-allowed'?'Allow microphone access using the lock icon in the address bar.':e.error==='no-speech'?'I could not hear anything. Please try again.':'Mic error: '+e.error);
  rec.onend=()=>{listening=false;$('#mic').setAttribute('aria-pressed','false');status();if(got&&inp.value.trim())send(inp.value)};
  try{rec.start()}catch(e){hint('The microphone did not start. Wait a moment, then try again.')}
};
$('#lang').value=S.lang;$('#lang').onchange=e=>{S.lang=e.target.value;save()};

/* ---------- Voice switch + clear ---------- */
const vs=$('#vs');vs.setAttribute('aria-checked',S.voice);
vs.onclick=()=>{S.voice=vs.getAttribute('aria-checked')!=='true';vs.setAttribute('aria-checked',S.voice);if(!S.voice){stopTalk()}save()};

render();status();initAvatar(window.SK_AVATAR);
</script>
